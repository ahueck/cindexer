name: CI

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install flake8 black

      - name: Run black
        run: black --check --diff .

      - name: Run flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install LLVM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install libclang

      - name: Configure libClang path
        run: |
          LLVM_LIB_PATH=$(llvm-config --libdir)
          echo "Found LLVM Lib Path: $LLVM_LIB_PATH"
          echo "LD_LIBRARY_PATH=$LLVM_LIB_PATH" >> $GITHUB_ENV

      - name: Run Tests
        run: python -m unittest tests/test_dump_types.py
